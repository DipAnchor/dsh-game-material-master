# 开发/测试用的 cordis patch 覆盖层。
#
# 用途：给测试宿主打开「宿主半区热重载」，让改完 `lib/*.js` 立即生效，
# 不必重启 Harness（重启会掐断正在跑的 agent 会话）。
#
# 背景：`@deepseek-ai/dsh-base` 的补丁里已经有这一行了
#
#     - id: hmr
#       name: '@deepseek-ai/dsh-hmr'
#       disabled: !!js "!ctx.get('profileContext')"
#       config:
#         root: []
#
#   注释原文是「Profile configuration reloads by default; module roots are opt-in.」
#   —— 也就是说 `root: []` 是**故意的**：只重载 profile 配置，不监听任何模块目录。
#   而 `Hmr.Config.base` 是**必填**的（zod `base: z.string()`），所以那一行实际创建
#   失败、被吞掉，HMR 服务根本不存在，`watchUserPatches` 也连带跳过（它要求
#   `ctx.get("hmr")` 存在）。要靠本文件把它救回来。
#
# 用法（测试宿主）：
#   dsh --profile web --patch scripts/dev-overlay.yml --port 43121 --no-open
#
# 三条踩过的坑：
#   ① 包名是 `@deepseek-ai/dsh-hmr`。早先写的 `@deepseek-ai/cordis-plugin-hmr`
#      **不存在**，报 `failed to import`——那条警告很容易被淹没在启动日志里，
#      表现只是「HMR 没生效」。
#   ② **不能 `insert`**：profile 那一层已经注册过 `hmr` 服务，插一行新插件会撞名，
#      报 `service "hmr" has been registered at <Hmr>`。要用「带 id、不带 insert」的
#      **覆盖式补丁**——而且 `config` 是**整体替换、不做深合并**，所以 `root`、`debounce`
#      和 `disabled` 都得原样重申一遍。
#   ③ `base` 会被 `new URL(base, ctx.baseUrl)` 解析后再 fileURLToPath，所以**必须写成
#      file:// URL**；写成 `D:/...` 会被当成 `d:` scheme 而抛 ERR_INVALID_URL_SCHEME。
#
# ⚠️ 下面那个 `base` 是**机器相关**的：必须指向你自己那份 checkout 的 `lib/`。
# 换机器 / 换 clone 位置都要改；改错了**不会报错**，只是监听了一个不存在的目录，
# 表现为「HMR 起来了但改代码不生效」。
#
# 不用于生产：正式启动走用户 profile 的 patch 层，本文件只在测试时通过 --patch 注入。
- id: hmr
  name: '@deepseek-ai/dsh-hmr'
  disabled: !!js "!ctx.get('profileContext')"
  config:
    base: file:///G:/p-ai/works/game-material-master/dsh-game-material-master/lib
    root: ["."]
    debounce: 150
